name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -q
      - name: Build package
        run: uv build
      - name: Build menu bar app
        run: bash macos/scripts/build-app.sh
      - name: Build dmg
        run: bash macos/scripts/build-dmg.sh
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: macos/build/DatasetAnalysisMCP.dmg

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release/python-dist
      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release/mac-dmg
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/python-dist/*
            release/mac-dmg/DatasetAnalysisMCP.dmg

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build website
        working-directory: website
        run: |
          npm install
          npm run build
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
