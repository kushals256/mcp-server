[project]
name = "dataset-analysis-mcp"
version = "0.1.1"
description = "A stateful Model Context Protocol server that turns LLMs into data scientists on macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dataset Analysis MCP Contributors", email = "hello@example.com" }
]
keywords = ["mcp", "dataset-analysis", "data-quality", "eda", "outlier-detection", "claude", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "category-encoders>=2.6.0",
    "clean-text>=0.6.0",
    "fastapi>=0.128.0",
    "flashtext>=2.7",
    "mcp>=1.26.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.0.0",
    "skrub>=0.3.0",
    "text-unidecode>=1.3",
    "uvicorn>=0.40.0",
]

[project.urls]
Homepage = "https://kushals256.github.io/mcp-server/"
Repository = "https://github.com/kushals256/mcp-server"
Documentation = "https://kushals256.github.io/mcp-server/install/"

[project.scripts]
dataset-analysis-mcp = "cli:run_server"
dataset-analysis-mcp-setup = "cli:run_setup_cli"
dataset-analysis-mcp-doctor = "cli:run_doctor"
dataset-analysis-mcp-disable = "cli:run_disable"
dataset-analysis-mcp-enable = "cli:run_enable"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.py" = "config.py"
"cli.py" = "cli.py"
"examples/sample_sales.csv" = "examples/sample_sales.csv"

[tool.hatch.build.targets.sdist]
include = [
    "main.py",
    "config.py",
    "cli.py",
    "tools",
    "utils",
    "examples",
    "macos",
    "website",
    "README.md",
    "requirements.txt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
