[project]
name = "mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server for comprehensive dataset analysis with stateful workflow support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mcp", "dataset-analysis", "data-quality", "eda", "outlier-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.128.0",
    "mcp>=1.26.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.0.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.py" = "config.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

